You need State DP whenever "index $i$" alone does not give you enough 
context to make a valid decision for step $i+1$.
1. Does a choice at step $i$ lock or unlock choices at 
step $i+1$?If Yes $\rightarrow$ State DP.
Example: "If I paint house $i$ Red, I cannot paint house $i+1$ Red." 
You must track color at step $i$.
2. Is there a "memory" requirement that resets or changes based on 
actions?If Yes $\rightarrow$ State DP.
Example: "After selling stock, I must rest for 1 day." The system needs 
memory of whether you are Holding, In Cooldown, or Free to Buy.
The 3-Step Method to Identify the Exact State Needed
When designing the state, your goal is minimality: 
include just enough information so that future choices depend only on 
the current state, without carrying unnecessary history.