// All major merge-interval variants

The good news is that most interval questions reuse the same underlying idea. What changes is 
the operation you perform on the intervals.

1

Merge overlapping intervals

Sort + current interval + extend right boundary

Representative problem: Merge Intervals

https://leetcode.com/problems/merge-intervals/description/

2

Insert a new interval

Scan before + merge overlaps + scan after

Representative problem: Insert Interval

3

Find intersections

Two pointers + max start + min end  

Representative problem: Interval List Intersections

4

Remove covered intervals

Sort + track maximum right boundary

Representative problem: Remove Covered Intervals

Sort Strategy:Sort intervals primarily by start point in ascending order ($a[0] \uparrow$).If 
two intervals have the same start point, sort by end point in descending order ($a[1] \downarrow$).
Why reverse-sort end points for ties? Placing the larger interval first ensures that any smaller 
interval starting at the same position is immediately recognized as covered without edge-case bugs.
Tracking the Boundary:Iterate through the sorted list and maintain maxEnd (the largest right 
boundary seen so far).For any current interval [start, end]:If end <= maxEnd, this interval is 
completely covered by a previous interval.If end > maxEnd, this interval extends past all previous
intervals and cannot be covered. We increment our non-covered count and update maxEnd = end.

5

Minimum meeting rooms

Sort + min-heap of end times

Representative problem: Meeting Rooms II

6

Maximum non-overlapping intervals

Sort by end + greedy selection

Representative problem: Non-overlapping Intervals

The Non-overlapping Intervals problem asks for the minimum number of intervals to remove so that 
the remaining intervals do not overlap.
This is equivalent to finding the maximum number of non-overlapping intervals you can keep, and 
subtracting that count from the total number of intervals.




7

Interval scheduling with weights

Sort + DP + binary search

Representative problem: Maximum Profit in Job Scheduling

8

Dynamic interval queries

Ordered map / TreeMap / segment tree

Representative problem: My Calendar / range queries


