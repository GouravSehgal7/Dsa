concept of line sweep 
The Unbreakable Rules of Pure Line SweepAny algorithm that qualifies as a pure Line Sweep strictly
adheres to three core 
phases:$$\text{Intervals } [s_i, e_i] \xrightarrow{\text{1. Event Generation}} \text{List } (x, \Delta) \xrightarrow{\text{2. Sorting}} \text{Ordered Stream} \xrightarrow{\text{3. Sweeping}} \text{Prefix Sum } \sum \Delta$$1. Event Generation (Deconstruction)An interval $[s_i, e_i]$ is never processed as a single whole object. It is broken into two independent, point-in-time events:Entry event at $s_i$ with delta $+1$Exit event at $e_i$ with delta $-1$2. Event Sorting (Temporal Ordering)All $2N$ events are merged into a single timeline and sorted purely by their coordinate $x$. If two coordinates are identical, a secondary tie-breaking rule dictates whether exit events ($-1$) or entry events ($+1$) come first (depending on whether boundaries are inclusive or exclusive).3. State Accumulation (Prefix Sum Sweep)The sweep line steps through coordinates $x_1, x_2, \dots, x_{2N}$ one event at a time. The active count (or system state) at coordinate $x_k$ is strictly the running total of all deltas encountered so far:$$\text{Active State}(x_k) = \sum_{j=1}^{k} \Delta_j$$
